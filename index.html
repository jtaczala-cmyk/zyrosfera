<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ŻyroSfera</title>
<style>
  body { margin:0; background:#000; overflow:hidden; touch-action:none; font-family:system-ui,sans-serif; color:#adf; }
  #hud { position:absolute; top:14px; left:14px; background:rgba(0,10,25,0.55); padding:10px 14px; border-radius:8px; font-size:14px; z-index:10; pointer-events:none; backdrop-filter:blur(6px); border:1px solid rgba(0,180,255,0.25); }
  #overlay { position:absolute; inset:0; background:rgba(0,5,15,0.96); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:20; text-align:center; }
  #overlay h1 { color:#0ff; margin:0 0 8px; text-shadow:0 0 20px #0af; font-size:32px; }
  #overlay p { opacity:0.8; margin-bottom:20px; }
  #overlay button { padding:14px 36px; font-size:18px; background:linear-gradient(180deg,#0cf,#08a); color:#fff; border:none; border-radius:12px; box-shadow:0 0 30px #0af8; cursor:pointer; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">Fragmenty Serca: <span id="sc">0</span> / 7</div>
<div id="overlay">
  <h1>ŻyroSfera</h1>
  <p>Przeciągaj palcem, aby sterować</p>
  <button id="go">Wejdź</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

<script>
const scEl = document.getElementById('sc');
document.getElementById('go').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
  init();
};

let scene, camera, renderer, composer, bloomPass, sphere, crystals = [], particles, score = 0;
let tx = 0, tz = 0;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02040c);
  scene.fog = new THREE.FogExp2(0x02040c, 0.035);

  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 50);
  camera.position.set(0, 3.5, 9);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  const renderScene = new THREE.RenderPass(scene, camera);
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.4, 0.6, 0.2);
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  scene.add(new THREE.AmbientLight(0x0a1830, 0.3));
  const key = new THREE.PointLight(0x66eeff, 5, 20);
  key.position.set(0, 5, 2);
  scene.add(key);
  const rim = new THREE.PointLight(0xcc55ff, 3, 14);
  rim.position.set(-5, 2, -3);
  scene.add(rim);
  const fill = new THREE.PointLight(0x4488ff, 1.5, 12);
  fill.position.set(4, 1, 3);
  scene.add(fill);

  const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({ color: 0x050a14, metalness: 0.9, roughness: 0.2 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.5, 64), new THREE.MeshBasicMaterial({ color: 0x2266ff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  scene.add(ring);

  scene.add(new THREE.GridHelper(32, 32, 0x1a3a70, 0x061018));

  const sphereMat = new THREE.MeshPhysicalMaterial({
    color: 0xaaeeff,
    emissive: 0x0088ff,
    emissiveIntensity: 3.5,
    metalness: 0.05,
    roughness: 0.02,
    transparent: true,
    opacity: 0.9,
    transmission: 0.6,
    thickness: 1.2,
    clearcoat: 1,
    clearcoatRoughness: 0.01
  });
  sphere = new THREE.Mesh(new THREE.SphereGeometry(0.8, 64, 64), sphereMat);
  sphere.position.y = 0.8;
  scene.add(sphere);

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  sphere.add(core);

  for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.45 + i * 0.12, 0.008, 8, 48), new THREE.MeshBasicMaterial({ color: 0xaaffff, transparent: true, opacity: 0.7 }));
    r.rotation.x = Math.PI / 2;
    sphere.add(r);
  }

  const cGeo = new THREE.OctahedronGeometry(0.4, 1);
  for (let i = 0; i < 7; i++) {
    const cMat = new THREE.MeshStandardMaterial({
      color: 0xeeaaff,
      emissive: 0xbb33ff,
      emissiveIntensity: 2,
      metalness: 0.1,
      roughness: 0.08,
      transparent: true,
      opacity: 0.85
    });
    const crystal = new THREE.Mesh(cGeo, cMat);
    const angle = (i / 7) * Math.PI * 2;
    const dist = 3.5 + Math.random() * 2.5;
    crystal.position.set(Math.cos(angle) * dist, 0.6 + Math.random() * 0.8, Math.sin(angle) * dist);
    crystal.userData = { collected: false, spin: 0.5 + Math.random() * 0.8 };
    scene.add(crystal);
    crystals.push(crystal);
  }

  const pGeo = new THREE.BufferGeometry();
  const pCount = 400;
  const positions = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount * 3; i++) positions[i] = (Math.random() - 0.5) * 30;
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x66aaff, size: 0.04, transparent: true, opacity: 0.6 }));
  scene.add(particles);

  const el = renderer.domElement;
  el.addEventListener('touchstart', e => { e.preventDefault(); setTarget(e.touches[0]); }, { passive: false });
  el.addEventListener('touchmove', e => { e.preventDefault(); setTarget(e.touches[0]); }, { passive: false });
  function setTarget(t) {
    tx = ((t.clientX / innerWidth) * 2 - 1) * 7;
    tz = (-(t.clientY / innerHeight) * 2 + 1) * 5;
  }

  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  if (!sphere) return;

  sphere.position.x += (tx - sphere.position.x) * 0.08;
  sphere.position.z += (tz - sphere.position.z) * 0.08;
  sphere.position.y = 0.8 + Math.sin(Date.now() * 0.002) * 0.08;
  sphere.rotation.y += 0.02;

  camera.position.x = sphere.position.x * 0.2;
  camera.position.z = sphere.position.z * 0.2 + 9;
  camera.lookAt(sphere.position.x, 0.5, sphere.position.z);

  crystals.forEach(c => {
    if (c.userData.collected) return;
    c.rotation.y += c.userData.spin * 0.02;
    c.rotation.x += 0.01;
    c.position.y = 0.7 + Math.sin(Date.now() * 0.003 + c.position.x) * 0.15;
    if (sphere.position.distanceTo(c.position) < 1.1) {
      c.userData.collected = true;
      c.visible = false;
      score++;
      scEl.textContent = score;
      bloomPass.strength = 2.2;
      setTimeout(() => bloomPass.strength = 1.4, 200);
    }
  });

  particles.rotation.y += 0.0008;

  composer.render();
}
</script>
</body>
</html>
