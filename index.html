    bloom.strength=2.8;gk=0.8+0.2*q;amt=0.6+0.4*q;ca=q;fov=70+4*q;br=1+0.16*Math.sin(e*Math.PI*2*2.5);palette(A,B,sm(q));bh.look.copy(BHP);}
  else if(e<4.0){if(bh.ph<3){bh.ph=3;world(false);bhSilence();}// near-silence, almost black, only filaments
    bloom.strength=0.35;gk=1;amt=0.7;ca=0.4;fov=74;br=1;bh.spin=10;}
  else if(e<5.4){const h=(e-4.0)/1.4;// HYPERSPACE: streaks burst toward camera in the next zone's palette
    if(bh.ph<3.5){bh.ph=3.5;if(!hs)initHS();hs.geometry.setDrawRange(0,hsCount()*2);const M=hs.material.uniforms;M.c1.value.setHex(B.cr[0]);M.c2.value.setHex(B.cr[1]);M.c3.value.setHex(B.top);hs.userData.d=0;hs.visible=true;whoosh();}
    const acc=sm(cl(h/0.4)),M=hs.material.uniforms;hs.userData.d+=dt*0.016*(4+acc*140);M.t.value=hs.userData.d;M.spd.value=acc;M.op.value=cl(h/0.1)*(h>0.85?1-(h-0.85)/0.15*0.7:1);
    hs.position.copy(camera.position);hs.quaternion.copy(camera.quaternion);
    bloom.strength=lerp(0.6,1.8,acc);gk=0;amt=0.15*(1-acc);ca=0.3+0.5*acc;fov=lerp(74,104,sm(cl(h/0.6)));br=h>0.88?1+(h-0.88)*14:1;bh.spin=10;}
  else if(e<6.7){if(bh.ph<4){bh.ph=4;if(hs)hs.visible=false;palette(A,B,1);setZone(bh.to);world(true);bhExitAudio(bh.to);tx=0;tz=1.5;bh.start=BHP.clone();}
    const r=(e-5.4)/1.3,rs=sm(r);appear=rs;sphere.position.lerpVectors(bh.start,_v.set(0,0.9,1.5),rs);bh.spin=lerp(10,1,r);const fs=lerp(4.4,1,rs);fil.scale.set(fs,lerp(1.6,1,rs),fs);
    sphere.material.opacity=1*rs;sphere.children[1].material.opacity=0.25*rs;sphere.children[0].scale.setScalar(0.1+0.9*rs);
    bloom.strength=lerp(0.35,0.9,rs);gk=1-rs;amt=0.7*(1-rs);ca=0.4*(1-rs);br=lerp(2.2,1,sm(cl(r*3)))*Math.max(Math.pow(r,0.4),0.35);fov=lerp(104,56,rs);bs=1-rs;bh.look.lerp(_v.set(sphere.position.x,0.6,sphere.position.z),0.15);}
  else{if(bh.ph<4){palette(A,B,1);setZone(bh.to);world(true);tx=0;tz=1.5;}endBH();return;}// frame hitch safety: never skip the zone switch
  bhG.scale.setScalar(Math.max(bs,0.001));bhG.children[0].rotation.z+=0.02*dt;bhG.children[1].material.opacity=0.85+0.15*Math.sin(e*20);
  bhG.userData.arcs.forEach((m,i)=>{m.rotation.z+=m.userData.sp*0.03*dt*(1+amt*3);const c=i<3?A.cr[i]:0x9ff8ff;m.material.color.setHex(c);m.material.opacity=cl((e-0.6)/1.2)*0.9;m.scale.set(1+amt*0.35,1-amt*0.12,1);});
  trail.forEach((s,i)=>s.position.lerp(BHP,0.04*amt));
  stretchGrid(gk);if(camera.fov!==fov){camera.fov=fov;camera.updateProjectionMatrix();}
  _v.copy(BHP).project(camera);U.c.value.set(_v.x*.5+.5,_v.y*.5+.5);U.amt.value=amt;U.ca.value=ca;U.bright.value=br;}
function endBH(){bh.on=false;if(hs)hs.visible=false;bhPass.enabled=false;bhG.visible=false;appear=1;fil.scale.set(1,1,1);sphere.material.opacity=1;sphere.children[1].material.opacity=0.25;sphere.children[0].scale.setScalar(1);
  stretchGrid(0);camera.fov=56;camera.updateProjectionMatrix();bloom.strength=BLOOM_BASE;if(bhLow){bhLow=false;const k=bk();bloom.setSize(innerWidth/k|0,innerHeight/k|0);}mission(zone);}
