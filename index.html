<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ŻyroSfera</title>
<style>
body{margin:0;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#adf}
#hud{position:absolute;top:12px;left:12px;background:rgba(0,15,30,0.6);padding:8px 12px;border-radius:6px;font-size:14px;z-index:10;pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(0,5,15,0.95);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center}
#overlay button{margin-top:12px;padding:12px 28px;font-size:16px;background:#0af;color:#fff;border:none;border-radius:8px}
canvas{display:block}
</style>
</head>
<body>
<div id="hud">Fragmenty: <span id="sc">0</span>/6</div>
<div id="overlay">
<h2 style="color:#0ff">ŻyroSfera</h2>
<p style="opacity:0.85">Przeciągaj palcem po ekranie</p>
<button id="go">Start</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const sc=document.getElementById('sc');
document.getElementById('go').onclick=()=>{document.getElementById('overlay').style.display='none';start()};
let scene,camera,renderer,sphere,crystals=[],score=0,tx=0,tz=0;
function start(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x010308);
  scene.fog=new THREE.FogExp2(0x010308,0.045);
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,40);
  camera.position.set(0,3.2,8);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.4;
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x0a1830,0.4));
  const l1=new THREE.PointLight(0x77eeff,4,18); l1.position.set(0,4,1); scene.add(l1);
  const l2=new THREE.PointLight(0xcc66ff,2,12); l2.position.set(-4,2,-2); scene.add(l2);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(15,48),new THREE.MeshStandardMaterial({color:0x060c18,metalness:0.85,roughness:0.25}));
  floor.rotation.x=-Math.PI/2; scene.add(floor);
  scene.add(new THREE.GridHelper(30,30,0x1a4a8a,0x061020));
  const sMat=new THREE.MeshPhysicalMaterial({color:0xaaeeff,emissive:0x0088ff,emissiveIntensity:2.8,metalness:0.05,roughness:0.02,transparent:true,opacity:0.92,transmission:0.55,thickness:1,clearcoat:1,clearcoatRoughness:0.02});
  sphere=new THREE.Mesh(new THREE.SphereGeometry(0.75,64,64),sMat);
  sphere.position.y=0.75; scene.add(sphere);
  sphere.add(new THREE.Mesh(new THREE.SphereGeometry(0.32,32,32),new THREE.MeshBasicMaterial({color:0xffffff})));
  const cGeo=new THREE.OctahedronGeometry(0.38,1);
  for(let i=0;i<6;i++){
    const c=new THREE.Mesh(cGeo,new THREE.MeshStandardMaterial({color:0xeeaaff,emissive:0xaa22ff,emissiveIntensity:1.6,metalness:0.15,roughness:0.1,transparent:true,opacity:0.88}));
    const a=i/6*Math.PI*2, d=3.2+Math.random()*2.2;
    c.position.set(Math.cos(a)*d,0.55+Math.random()*0.7,Math.sin(a)*d);
    c.userData.ok=false; scene.add(c); crystals.push(c);
  }
  const el=renderer.domElement;
  el.addEventListener('touchstart',e=>{e.preventDefault();setT(e.touches[0])},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();setT(e.touches[0])},{passive:false});
  function setT(t){tx=((t.clientX/innerWidth)*2-1)*6.5; tz=(-(t.clientY/innerHeight)*2+1)*4.5;}
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  function loop(){
    requestAnimationFrame(loop);
    sphere.position.x+=(tx-sphere.position.x)*0.09;
    sphere.position.z+=(tz-sphere.position.z)*0.09;
    sphere.position.y=0.75+Math.sin(Date.now()*0.002)*0.06;
    sphere.rotation.y+=0.018;
    camera.position.x=sphere.position.x*0.22;
    camera.position.z=sphere.position.z*0.22+8;
    camera.lookAt(sphere.position);
    crystals.forEach(c=>{if(c.userData.ok)return; c.rotation.y+=0.025; if(sphere.position.distanceTo(c.position)<1.05){c.userData.ok=true;c.visible=false;score++;sc.textContent=score;}});
    renderer.render(scene,camera);
  }
  loop();
}
</script>
</body>
</html>
