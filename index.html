<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Aetheris</title>
<style>
  body{margin:0;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#eef}
  #hud{position:absolute;top:14px;left:14px;padding:10px 16px;border-radius:8px;font-size:14px;z-index:10;pointer-events:none;background:rgba(0,10,25,0.55);backdrop-filter:blur(8px);border:1px solid rgba(100,200,255,0.35)}
  #overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#0a2040 0%,#02040c 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center}
  #overlay h1{margin:0 0 10px;font-size:42px;font-weight:700;color:#0ff;text-shadow:0 0 30px #0af,0 0 60px #06f}
  #overlay button{margin-top:16px;padding:16px 40px;font-size:18px;background:linear-gradient(180deg,#0df,#08a);color:#fff;border:none;border-radius:12px;box-shadow:0 0 30px #0af;cursor:pointer}
  canvas{display:block}
  #tiltBtn{position:absolute;top:14px;right:14px;z-index:10;padding:10px 14px;font-size:14px;border-radius:8px;border:1px solid rgba(0,200,255,0.4);background:rgba(0,10,25,0.6);color:#adf;display:none}
  #toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:32px;font-weight:700;color:#fff;text-shadow:0 0 20px #0ff;z-index:15;pointer-events:none;opacity:0;transition:opacity .3s}
  #win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;background:rgba(0,4,12,0.9);text-align:center}
  #win button{margin-top:16px;padding:14px 34px;font-size:18px;background:linear-gradient(180deg,#0df,#08c);color:#fff;border:none;border-radius:12px}
</style>
</head>
<body>
<div id="hud">Fragmenty: <span id="sc">0</span>/7</div>
<button id="tiltBtn">Żyroskop: wył</button>
<div id="toast"></div>
<div id="win"><h1 style="color:#0ff;text-shadow:0 0 30px #0af">Ukończono</h1><p id="wt"></p><button onclick="location.reload()">Jeszcze raz</button></div>
<div id="overlay">
  <h1>Aetheris</h1>
  <p>Przeciągaj palcem</p>
  <button id="go">Start</button>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script>
const sc=document.getElementById('sc');
document.getElementById('go').onclick=()=>{document.getElementById('overlay').style.display='none';init()};
let scene,camera,renderer,composer,bloom,sphere,crystals=[],parts,score=0,tx=0,tz=0;
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x010308);
  scene.fog=new THREE.FogExp2(0x010308,0.022);
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,80);
  camera.position.set(0,4,11);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.25;
  document.body.appendChild(renderer.domElement);
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.6,0.6,0.25);
  composer.addPass(bloom);
  scene.add(new THREE.AmbientLight(0x0a1830,0.35));
  const key=new THREE.PointLight(0x66eeff,5,20);key.position.set(0,5,2);scene.add(key);
  const rim=new THREE.PointLight(0xcc55ff,3,14);rim.position.set(-5,2,-3);scene.add(rim);
  const fill=new THREE.PointLight(0x4488ff,1.8,12);fill.position.set(4,1.5,3);scene.add(fill);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(22,64),new THREE.MeshStandardMaterial({color:0x050a14,metalness:0.88,roughness:0.18}));
  floor.rotation.x=-Math.PI/2;scene.add(floor);
  scene.add(new THREE.GridHelper(40,40,0x1a4a88,0x061018));
  const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.5,64),new THREE.MeshBasicMaterial({color:0x44aaff,transparent:true,opacity:0.55,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.02;scene.add(ring);
  const sm=new THREE.MeshPhysicalMaterial({color:0xaaeeff,emissive:0x0088ff,emissiveIntensity:3.2,metalness:0.05,roughness:0.02,transparent:true,opacity:0.85,transmission:0.55,thickness:1.2,clearcoat:1,clearcoatRoughness:0.02});
  sphere=new THREE.Mesh(new THREE.SphereGeometry(0.85,64,48),sm);
  sphere.position.y=0.85;scene.add(sphere);
  sphere.add(new THREE.Mesh(new THREE.SphereGeometry(0.28,32,24),new THREE.MeshBasicMaterial({color:0xffffff})));
  for(let i=0;i<3;i++){
    const tor=new THREE.Mesh(new THREE.TorusGeometry(0.55+i*0.14,0.008,8,48),new THREE.MeshBasicMaterial({color:0xccffff,transparent:true,opacity:0.6}));
    tor.rotation.x=Math.PI/2;sphere.add(tor);
  }
  const cg=new THREE.OctahedronGeometry(0.42,1);
  for(let i=0;i<7;i++){
    const cm=new THREE.MeshStandardMaterial({color:0xeeaaff,emissive:0xbb33ff,emissiveIntensity:1.8,metalness:0.1,roughness:0.08,transparent:true,opacity:0.8});
    const c=new THREE.Mesh(cg,cm);
    const a=i/7*Math.PI*2,d=4+Math.random()*2.5;
    c.position.set(Math.cos(a)*d,0.7+Math.random()*0.8,Math.sin(a)*d);
    c.userData={ok:false,s:0.5+Math.random()*0.6};
    const cl=new THREE.PointLight(0xcc66ff,0.8,4);c.add(cl);
    scene.add(c);crystals.push(c);
  }
  const pg=new THREE.BufferGeometry();
  const pos=new Float32Array(500*3);
  for(let i=0;i<pos.length;i++)pos[i]=(Math.random()-0.5)*50;
  pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  parts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x88ccff,size:0.03,transparent:true,opacity:0.45}));
  scene.add(parts);
  const el=renderer.domElement;
  el.addEventListener('touchstart',e=>{e.preventDefault();setT(e.touches[0])},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();setT(e.touches[0])},{passive:false});
  function setT(t){tx=((t.clientX/innerWidth)*2-1)*7;tz=(-(t.clientY/innerHeight)*2+1)*5;}
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
  animate();
}
function animate(){
  requestAnimationFrame(animate);
  if(!sphere)return;
  sphere.position.x+=(tx-sphere.position.x)*0.08;
  sphere.position.z+=(tz-sphere.position.z)*0.08;
  sphere.position.y=0.85+Math.sin(Date.now()*0.002)*0.08;
  sphere.rotation.y+=0.02;
  camera.position.x=sphere.position.x*0.2;
  camera.position.z=sphere.position.z*0.2+11;
  camera.lookAt(sphere.position.x,0.6,sphere.position.z);
  crystals.forEach(c=>{
    if(c.userData.ok)return;
    c.rotation.y+=c.userData.s*0.02;
    c.rotation.x+=0.01;
    c.position.y=0.75+Math.sin(Date.now()*0.003+c.position.x)*0.15;
    if(sphere.position.distanceTo(c.position)<1.15){
      c.userData.ok=true;c.visible=false;score++;sc.textContent=score;
      bloom.strength=2.4;setTimeout(()=>bloom.strength=1.6,200);
    }
  });
  parts.rotation.y+=0.0005;
  composer.render();
}
</script>
</body>
</html>
