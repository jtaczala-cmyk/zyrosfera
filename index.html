<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Aetheris</title>
<style>
  body{margin:0;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#adf}
  #hud{position:absolute;top:14px;left:14px;background:rgba(0,10,25,0.5);padding:10px 14px;border-radius:8px;font-size:14px;z-index:10;pointer-events:none;backdrop-filter:blur(8px);border:1px solid rgba(0,200,255,0.3)}
  #overlay{position:absolute;inset:0;background:rgba(0,4,12,0.97);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center}
  #overlay h1{color:#0ff;margin:0 0 10px;font-size:36px;text-shadow:0 0 30px #0af,0 0 60px #06f}
  #overlay button{margin-top:16px;padding:16px 40px;font-size:18px;background:linear-gradient(180deg,#0df,#08c);color:#fff;border:none;border-radius:14px;box-shadow:0 0 40px #0af;cursor:pointer}
  canvas{display:block}
  #tiltBtn{position:absolute;top:14px;right:14px;z-index:10;padding:10px 14px;font-size:14px;border-radius:8px;border:1px solid rgba(0,200,255,0.4);background:rgba(0,10,25,0.6);color:#adf;display:none}
  #toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:28px;color:#fcf;text-shadow:0 0 20px #c4f;z-index:15;pointer-events:none;opacity:0;transition:opacity .3s}
  #win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;background:rgba(0,4,12,0.85);text-align:center}
  #win button{margin-top:16px;padding:14px 34px;font-size:18px;background:linear-gradient(180deg,#0df,#08c);color:#fff;border:none;border-radius:14px}
</style>
</head>
<body>
<div id="hud">Fragmenty: <span id="sc">0</span>/7</div>
<button id="tiltBtn">Żyroskop: wył</button>
<div id="toast"></div>
<div id="win"><h1 style="color:#0ff;text-shadow:0 0 30px #0af">Wszystkie fragmenty!</h1><p id="wt"></p><button onclick="location.reload()">Jeszcze raz</button></div>
<div id="overlay">
  <h1>Aetheris</h1>
  <p style="opacity:.85">Przeciągaj palcem</p>
  <button id="go">Start</button>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script>
window.goatcounter={path:location.pathname.replace(/index\.html$/,'')};
(function(){var g=document.createElement('script');g.async=true;g.src='/count.js';g.dataset.goatcounter='https://jtaczala-games.goatcounter.com/count';document.head.appendChild(g);})();
</script>
<script>
const sc=document.getElementById('sc');
document.getElementById('go').onclick=()=>{document.getElementById('overlay').style.display='none';t0=Date.now();init()};
let tilt={on:false,b:0,g:0,b0:null,g0:null},t0=0;
const DEAD=3,FULL=25;function ax(v){const a=Math.abs(v);return a<DEAD?0:Math.sign(v)*Math.min(1,(a-DEAD)/(FULL-DEAD));}
addEventListener('deviceorientation',e=>{if(e.beta==null)return;tilt.b=e.beta;tilt.g=e.gamma;if(tilt.on&&tilt.b0===null){tilt.b0=e.beta;tilt.g0=e.gamma;}});
const tb=document.getElementById('tiltBtn');
if(window.DeviceOrientationEvent&&matchMedia('(pointer:coarse)').matches)tb.style.display='block';
tb.onclick=async()=>{if(tilt.on){tilt.on=false;tb.textContent='Żyroskop: wył';return;}
  const D=window.DeviceOrientationEvent;if(typeof D.requestPermission==='function'){try{if(await D.requestPermission()!=='granted'){toast('Brak dostępu');return;}}catch(e){toast('Brak dostępu');return;}}
  tilt.on=true;tilt.b0=null;tb.textContent='Żyroskop: wł';toast('Skalibrowano');};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,700);}
let fx=[],fil;
let scene,camera,renderer,composer,bloom,sphere,crystals=[],parts,score=0,tx=0,tz=0;
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x010208);
  scene.fog=new THREE.FogExp2(0x010208,0.028);
  camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,60);
  camera.position.set(0,3.8,10);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2.5));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.35;
  document.body.appendChild(renderer.domElement);
  const rp=new THREE.RenderPass(scene,camera);
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),2.2,0.65,0.3);
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(rp);composer.addPass(bloom);
  scene.add(new THREE.AmbientLight(0x061428,0.25));
  const k=new THREE.PointLight(0x88ffff,6,22);k.position.set(0,5,2);scene.add(k);
  const r=new THREE.PointLight(0xdd66ff,3.5,16);r.position.set(-6,2,-3);scene.add(r);
  const f=new THREE.PointLight(0x3366ff,2,14);f.position.set(5,1.5,4);scene.add(f);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(18,64),new THREE.MeshStandardMaterial({color:0x040812,metalness:0.92,roughness:0.15}));
  floor.rotation.x=-Math.PI/2;scene.add(floor);
  const glowRing=new THREE.Mesh(new THREE.RingGeometry(2.8,3.1,64),new THREE.MeshBasicMaterial({color:0x44aaff,transparent:true,opacity:0.7,side:THREE.DoubleSide}));
  glowRing.rotation.x=-Math.PI/2;glowRing.position.y=0.03;scene.add(glowRing);
  scene.add(new THREE.GridHelper(36,36,0x1a4a88,0x040c18));
  const sm=new THREE.MeshPhysicalMaterial({color:0xbbffff,emissive:0x0066cc,emissiveIntensity:0.5,metalness:0.02,roughness:0.01,transparent:true,opacity:0.35,transmission:0.7,depthWrite:false,clearcoat:1,clearcoatRoughness:0});
  sphere=new THREE.Mesh(new THREE.SphereGeometry(0.9,64,64),sm);
  sphere.position.y=0.9;scene.add(sphere);
  sphere.add(new THREE.Mesh(new THREE.SphereGeometry(0.18,24,24),new THREE.MeshBasicMaterial({color:0xffffff})));
  fil=new THREE.Group();sphere.add(fil);
  for(let i=0;i<9;i++){const pts=[];const ph=Math.random()*6.28,k=2+Math.floor(Math.random()*3);
    for(let j=0;j<=80;j++){const t=j/80*Math.PI*2;const r=0.25+0.45*Math.abs(Math.sin(t*k+ph));pts.push(new THREE.Vector3(Math.cos(t)*r,Math.sin(t*k*0.5+ph)*0.55,Math.sin(t)*r));}
    const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),120,0.012,4,true),new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(0.5+Math.random()*0.15,1,0.7),transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.rotation.set(Math.random()*3,Math.random()*3,0);m.userData.sp=(Math.random()-.5)*0.04;fil.add(m);}
  for(let i=0;i<4;i++){
    const tor=new THREE.Mesh(new THREE.TorusGeometry(0.5+i*0.15,0.006,8,64),new THREE.MeshBasicMaterial({color:0xccffff,transparent:true,opacity:0.65}));
    tor.rotation.x=Math.PI/2;sphere.add(tor);
  }
  const cg=new THREE.OctahedronGeometry(0.45,1);
  for(let i=0;i<7;i++){
    const cm=new THREE.MeshStandardMaterial({color:0x8a2be2,emissive:0x9b30ff,emissiveIntensity:1.6,metalness:0.05,roughness:0.05,transparent:true,opacity:0.82});
    const c=new THREE.Mesh(cg,cm);
    const a=i/7*Math.PI*2,d=3.8+Math.random()*2.8;
    c.position.set(Math.cos(a)*d,0.7+Math.random()*1,Math.sin(a)*d);
    c.userData={ok:false,s:0.6+Math.random()*0.8};
    const cl=new THREE.PointLight(0xb040ff,1.2,3.5);c.add(cl);scene.add(c);crystals.push(c);
  }
  const pg=new THREE.BufferGeometry();
  const pos=new Float32Array(600*3);
  for(let i=0;i<pos.length;i++)pos[i]=(Math.random()-0.5)*40;
  pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  parts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x88ccff,size:0.035,transparent:true,opacity:0.55}));
  scene.add(parts);
  const el=renderer.domElement;
  el.addEventListener('touchstart',e=>{e.preventDefault();setT(e.touches[0])},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();setT(e.touches[0])},{passive:false});
  function setT(t){if(tilt.on)return;tx=((t.clientX/innerWidth)*2-1)*8;tz=((t.clientY/innerHeight)*2-1)*5.5;}
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
  animate();
}
function pickup(p){
  toast('+1');if(navigator.vibrate)navigator.vibrate(30);
  try{const A=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(660+score*80,A.currentTime);o.frequency.exponentialRampToValueAtTime(1320+score*80,A.currentTime+0.15);g.gain.setValueAtTime(0.15,A.currentTime);g.gain.exponentialRampToValueAtTime(0.001,A.currentTime+0.3);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+0.3);}catch(e){}
  const g=new THREE.TetrahedronGeometry(0.08);
  for(let i=0;i<18;i++){const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xff99ff,transparent:true}));m.position.copy(p);scene.add(m);fx.push({m,life:1,v:new THREE.Vector3((Math.random()-.5)*.15,Math.random()*.15,(Math.random()-.5)*.15)});}
  if(score>=7)setTimeout(()=>{document.getElementById('wt').textContent='Czas: '+((Date.now()-t0)/1000).toFixed(1)+' s';document.getElementById('win').style.display='flex';},600);
}
function animate(){
  requestAnimationFrame(animate);
  if(!sphere)return;
  if(tilt.on&&tilt.b0!==null){tx=Math.max(-8,Math.min(8,tx+ax(tilt.g-tilt.g0)*0.25));tz=Math.max(-5.5,Math.min(5.5,tz+ax(tilt.b-tilt.b0)*0.25));}
  fx=fx.filter(o=>{o.life-=0.03;o.m.position.addScaledVector(o.v,1);o.v.y-=0.004;o.m.material.opacity=Math.max(0,o.life);if(o.life<=0){scene.remove(o.m);return false;}return true;});
  sphere.position.x+=(tx-sphere.position.x)*0.07;
  sphere.position.z+=(tz-sphere.position.z)*0.07;
  sphere.position.y=0.9+Math.sin(Date.now()*0.0018)*0.1;
  sphere.rotation.y+=0.025;
  fil.children.forEach((m,i)=>{m.rotation.x+=m.userData.sp;m.rotation.z+=m.userData.sp*0.7;m.material.opacity=0.6+0.4*Math.sin(Date.now()*0.004+i);});
  camera.position.x=sphere.position.x*0.18;
  camera.position.z=sphere.position.z*0.18+10;
  camera.lookAt(sphere.position.x,0.6,sphere.position.z);
  crystals.forEach(c=>{
    if(c.userData.ok)return;
    c.rotation.y+=c.userData.s*0.025;
    c.rotation.x+=0.012;
    c.position.y=0.8+Math.sin(Date.now()*0.0025+c.position.x)*0.2;
    if(sphere.position.distanceTo(c.position)<1.2){
      c.userData.ok=true;c.visible=false;c.children[0].intensity=0;score++;sc.textContent=score;
      bloom.strength=3.4;setTimeout(()=>bloom.strength=2.2,220);
      pickup(c.position);
    }
  });
  parts.rotation.y+=0.0006;
  composer.render();
}
</script>
</body>
</html>
