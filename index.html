function setZone(z){
  zone=z;const Z=ZONES[z];
  sky.material.uniforms.top.value.setHex(Z.top);sky.material.uniforms.mid.value.setHex(Z.mid);sky.material.uniforms.bot.value.setHex(Z.bot);
  scene.fog.color.setHex(Z.fog).multiplyScalar(0.45);floorM.color.setHex(Z.floor);floorM.emissive.setHex(Z.floor);
  gridH.material.color.setHex(Z.grid);ring.children.forEach(m=>m.material.color.setHex(Z.ring));
  L1.color.setHex(Z.light[0]);L2.color.setHex(Z.light[1]);HL.color.setHex(Z.top);HL.groundColor.setHex(Z.floor);
  SM.emissive.setHex(Z.ring);SM.color.setHex(Z.top).lerp(new THREE.Color(0xffffff),0.75);HALO.material.color.setHex(Z.ring);
  const pc=parts.geometry.attributes.color;for(let i=0;i<pc.count;i++){const c=new THREE.Color(Z.cr[i%3]).lerp(new THREE.Color(Z.top),Math.random()*.5);pc.setXYZ(i,c.r,c.g,c.b);}pc.needsUpdate=true;
  document.getElementById('lvl').textContent=L().zone+' '+(z+1)+' · '+Z.name;
  crystals.forEach(c=>scene.remove(c));crystals=[];score=0;sc.textContent=0;
  const shapes=[new THREE.OctahedronGeometry(0.45,0),new THREE.IcosahedronGeometry(0.42,0),new THREE.DodecahedronGeometry(0.42,0)];
  for(let i=0;i<7;i++){
    const col=Z.cr[i%3];
    const c=new THREE.Mesh(shapes[z],new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:0.32,metalness:0.55,roughness:0.15,flatShading:true}));
    const g=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.5}));g.scale.set(1.8,1.8,1);c.add(g);
    const a=i/7*Math.PI*2+z,d=3.6+Math.random()*2.8;
    c.position.set(Math.cos(a)*d,0.8,Math.sin(a)*d*0.8);
    c.userData={ok:false,s:0.6+Math.random()*0.8,col:new THREE.Color(col)};
    scene.add(c);crystals.push(c);
  }
  const t=L();story(t.zone+' '+(z+1)+' / '+ZONES.length,Z.name,[t.m[z]],t.go);
}
function emit(p,col,n,spd){const pa=spark.geometry.attributes.position,ca=spark.geometry.attributes.color;
  for(let k=0;k<n;k++){const i=spark.userData.i=(spark.userData.i+1)%sparkV.length;const o=sparkV[i];
    pa.setXYZ(i,p.x,p.y,p.z);const c=col||new THREE.Color().setHSL(Math.random(),1,.6);ca.setXYZ(i,c.r,c.g,c.b);
    o.v.set((Math.random()-.5),(Math.random()-.2),(Math.random()-.5)).normalize().multiplyScalar(spd*(0.4+Math.random()));o.life=1;}
  ca.needsUpdate=true;}
function pickup(c){
  const p=c.position;if(score===3)toast(L().ev[zone],2200);else toast(score>=7?L().got:'+1',score>=7?1200:700);if(navigator.vibrate)navigator.vibrate(30);
  try{const A=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.setValueAtTime(660+score*80,A.currentTime);o.frequency.exponentialRampToValueAtTime(1320+score*80,A.currentTime+0.15);g.gain.setValueAtTime(0.15,A.currentTime);g.gain.exponentialRampToValueAtTime(0.001,A.currentTime+0.3);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+0.3);}catch(e){}
  emit(p,c.userData.col,40,0.22);emit(p,null,30,0.14);
  shell.position.copy(p);shell.material.color.copy(c.userData.col);shell.material.opacity=0.8;shell.scale.setScalar(0.3);
  shake=0.25;bloom.strength=1.8;
  if(score>=7){total++;
    if(zone<ZONES.length-1)setTimeout(()=>setZone(zone+1),700);
    else setTimeout(()=>{document.getElementById('wend').textContent=L().wb;document.getElementById('wt').textContent=L().time+': '+((Date.now()-t0)/1000).toFixed(1)+' s';document.getElementById('win').style.display='flex';},600);}
}
let lt=performance.now();
function animate(){
  requestAnimationFrame(animate);
  if(!sphere)return;
  const now=performance.now(),rdt=(now-lt)/16.67,dt=Math.min(2,rdt);lt=now;const T=Date.now();if(!paused&&!document.hidden)adapt(Math.min(rdt,6));
  if(tilt.on&&tilt.b0!==null){tx=Math.max(-8,Math.min(8,tx+ax(tilt.g-tilt.g0)*0.25));tz=Math.max(-5.5,Math.min(5.5,tz+ax(tilt.b-tilt.b0)*0.25));}
  sphere.position.x+=(tx-sphere.position.x)*0.07;
  sphere.position.z+=(tz-sphere.position.z)*0.07;
  sphere.position.y=0.9+Math.sin(T*0.0018)*0.1;
  sphere.rotation.y+=0.025;
  fil.children.forEach((m,i)=>{m.rotation.x+=m.userData.sp;m.rotation.z+=m.userData.sp*0.7;});
  // trail
  for(let i=trail.length-1;i>0;i--)trail[i].position.lerp(trail[i-1].position,0.55);
  trail[0].position.copy(sphere.position);
  trail.forEach((s,i)=>{const k=1-i/trail.length;s.scale.setScalar(0.9*k+0.08);s.material.opacity=0.42*k;s.material.color.setHex(ZONES[zone].cr[i%3]);});
  // sparkles
  const pa=spark.geometry.attributes.position;
  for(let i=0;i<sparkV.length;i++){const o=sparkV[i];if(o.life<=0)continue;o.life-=0.025*dt;o.v.y-=0.004*dt;o.v.multiplyScalar(0.97);
    pa.setXYZ(i,pa.getX(i)+o.v.x*dt,pa.getY(i)+o.v.y*dt,pa.getZ(i)+o.v.z*dt);if(o.life<=0)pa.setY(i,-99);}
  pa.needsUpdate=true;
  if(shell.material.opacity>0){shell.scale.multiplyScalar(1+0.12*dt);shell.material.opacity=Math.max(0,shell.material.opacity-0.05*dt);}
  bloom.strength+=(BLOOM_BASE-bloom.strength)*0.08;
  shake*=0.88;
  camera.position.x=sphere.position.x*0.18+(Math.random()-.5)*shake;
  camera.position.y=4.2+(Math.random()-.5)*shake;
  camera.position.z=sphere.position.z*0.18+10;
  camera.lookAt(sphere.position.x,0.6,sphere.position.z);
  crystals.forEach((c,i)=>{
    if(c.userData.ok)return;
    c.rotation.y+=c.userData.s*0.03;c.rotation.x+=0.012;
    c.position.y=0.85+Math.sin(T*0.0025+i)*0.22;
    const s=1+0.12*Math.sin(T*0.006+i);c.scale.setScalar(s);
    if(Math.random()<0.08)emit(c.position.clone().add(new THREE.Vector3((Math.random()-.5)*.8,(Math.random()-.5)*.8,(Math.random()-.5)*.8)),c.userData.col,1,0.02);
    if(!paused&&sphere.position.distanceTo(c.position)<1.2){c.userData.ok=true;c.visible=false;score++;sc.textContent=score;pickup(c);}
  });
  ring.rotation.y+=0.003;ring.children.forEach((m,i)=>m.material.opacity=0.3+0.25*Math.sin(T*0.003+i));
  parts.rotation.y+=0.0008;
  sky.material.uniforms.t.value=T*0.001;
  composer.render();
}
</script>
