<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hyperspace v2</title>
<style>
  body{margin:0;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block}
  #ui{position:absolute;top:16px;left:16px;font-size:14px;opacity:0.9;pointer-events:none;text-shadow:0 0 8px #0af}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#0a2040,#000);z-index:10}
  button{padding:18px 48px;font-size:20px;font-weight:700;background:linear-gradient(180deg,#0df,#08a);color:#fff;border:none;border-radius:14px;box-shadow:0 0 30px #0af;cursor:pointer}
</style>
</head>
<body>
<div id="ui">Prędkość nadświetlna</div>
<div id="start"><button id="go">Wejdź w tunel</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';run()};
function run(){
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x000510,0.012);
  const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,300);
  camera.position.z=5;
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;
  document.body.appendChild(renderer.domElement);

  const COUNT=800;
  const positions=new Float32Array(COUNT*6);
  const colors=new Float32Array(COUNT*6);
  const speeds=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    const angle=Math.random()*Math.PI*2;
    const radius=0.5+Math.random()*12;
    const z=-Math.random()*250;
    const x=Math.cos(angle)*radius;
    const y=Math.sin(angle)*radius;
    const len=15+Math.random()*40;
    positions.set([x,y,z, x,y,z-len], i*6);
    const c=new THREE.Color().setHSL(0.52+Math.random()*0.18,1,0.65+Math.random()*0.3);
    colors.set([c.r,c.g,c.b, c.r,c.g,c.b], i*6);
    speeds[i]=6+Math.random()*18;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending});
  const lines=new THREE.LineSegments(geo,mat);
  scene.add(lines);

  const glow=new THREE.Mesh(new THREE.SphereGeometry(0.8,32,24),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9}));
  scene.add(glow);
  const light=new THREE.PointLight(0xaaffff,8,40);
  scene.add(light);

  let speed=2;
  let t=0;
  function animate(){
    requestAnimationFrame(animate);
    t+=0.016;
    speed=Math.min(55,speed+0.22);
    const pos=geo.attributes.position.array;
    for(let i=0;i<COUNT;i++){
      const s=speeds[i]*speed*0.06;
      pos[i*6+2]+=s;
      pos[i*6+5]+=s;
      if(pos[i*6+2]>8){
        const angle=Math.random()*Math.PI*2;
        const radius=0.3+Math.random()*10;
        const nz=-200-Math.random()*80;
        const nx=Math.cos(angle)*radius;
        const ny=Math.sin(angle)*radius;
        const len=20+Math.random()*50;
        pos[i*6]=nx; pos[i*6+1]=ny; pos[i*6+2]=nz;
        pos[i*6+3]=nx; pos[i*6+4]=ny; pos[i*6+5]=nz-len;
      }
    }
    geo.attributes.position.needsUpdate=true;
    camera.fov=60+Math.min(40,speed*0.5);
    camera.updateProjectionMatrix();
    glow.scale.setScalar(1+Math.min(2,speed*0.03));
    light.intensity=6+speed*0.15;
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}
</script>
</body>
</html>
